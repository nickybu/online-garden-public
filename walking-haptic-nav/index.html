<div class="map-wrapper">
    <link rel="stylesheet" 
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          type="text/css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="anonymous" />
  
    <script type="text/javascript"
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin="anonymous"></script>
  
    <div class="controls-container">
      <button onclick="getLocation()" class="control-btn">Get My Location</button>
      <button onclick="resetView()" class="control-btn">Reset View</button>

  <script>
  const ORS_API_KEY = '';
  let map;
  let startMarker;
  let destinationMarker;
  let routeLayer;
  
  const defaultPosition = {
    coords: {
      latitude: 52.3727598,
      longitude: 4.8936041
    }
  };
  
  function initMap(position) {
    const lat = position.coords.latitude;
    const lon = position.coords.longitude;
    
    if (!map) {
      map = L.map('map-container').setView([lat, lon], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);
  
      
      map.on('click', function(e) {
        setDestinationMarker(e.latlng);
      });
    }
  
    
    if (startMarker) {
      map.removeLayer(startMarker);
    }
    
    startMarker = L.marker([lat, lon], {
      icon: L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41]
      })
    }).addTo(map)
  
    
    map.setView([lat, lon], 13);
  }
  
  function setDestinationMarker(latlng) {
    if (destinationMarker) {
      map.removeLayer(destinationMarker);
    }
    
    destinationMarker = L.marker(latlng, {
      draggable: true,
      icon: L.icon({
        iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41]
      })
    }).addTo(map)
  
    
    destinationMarker.on('dragend', function() {
      if (routeLayer) {
        map.removeLayer(routeLayer);
      }
    });
  }
  
  function resetView() {
    if (map && startMarker) {
      
      const pos = startMarker.getLatLng();
      map.setView(pos, 13);
      
      
      if (routeLayer) {
        map.removeLayer(routeLayer);
      }
      
      
      if (destinationMarker) {
        map.removeLayer(destinationMarker);
      }
    }
  }
  
  async function getDirections() {
    if (!startMarker || !destinationMarker) {
      alert('Please set both start and destination points');
      return;
    }
    
    const start = startMarker.getLatLng();
    const end = destinationMarker.getLatLng();
    
    try {
      const response = await fetch(
        'https://api.openrouteservice.org/v2/directions/foot-walking/geojson',
        {
          method: 'POST',
          headers: {
            'Authorization': ORS_API_KEY,
            'Content-Type': 'application/json',
            'Origin': ["https://nickybu.github.io", "http://localhost:1313"],
          },
          body: JSON.stringify({
            coordinates: [
              [start.lng, start.lat],
              [end.lng, end.lat]
            ]
          })
        }
      );
      
      if (!response.ok) {
        throw new Error(`Directions failed: ${response.status}`);
      }
  
      const data = await response.json();
      
      if (routeLayer) {
        map.removeLayer(routeLayer);
      }
      
      routeLayer = L.geoJSON(data, {
        style: {
          color: '#007bff',
          weight: 6,
          opacity: 0.6
        }
      }).addTo(map);
      
      map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
    } catch (error) {
      console.error('Directions error:', error);
      alert('Error getting directions. Please try again.');
    }
  }
  
  function getLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        initMap,
        (error) => {
          console.error('Location error:', error);
          initMap(defaultPosition);
        },
        {
          enableHighAccuracy: true,
          timeout: 5000,
          maximumAge: 0
        }
      );
    } else {
      alert('Geolocation is not supported by your browser');
      initMap(defaultPosition);
    }
  }
  
  
  window.addEventListener('load', () => initMap(defaultPosition));
  </script>

        "content": "Modular instruments generally perform specific roles and connect between one another (using patch cables) to carry the signal from input to output. Fluctuations in positive and negative voltages cause a speaker to move and reproduce the analog sound.\nBelow is a list of terms I\u0026rsquo;ve needed to understand:\nControl Voltage (CV) is an analog electrical signal ranging between ± 10 volts that can be used to control trigger or modulate parameters. Gates, Triggers, Clocks, Square Waves toggle between high and low voltage states, often used to trigger sounds or events, synchronise timing, or flip the state of something. Clocks provide regular on/off square wave signals used to synchronise sequencers and tempo-based effects. Clock dividers/multipliers take an incoming clock and divide/multiply it to create a syncrhonised signal at a different but related rate. They can also be used to divide an audio signal. Gates can be held open whereas Triggers provide a brief high state which otherwise remains off. Clocks and square waves repeatedly toggle between high and low states. Pitch Envelope is a contoured unipolar (+ or -) CV single cycle function. Typically come with controls for attack delay, sustain and release (ADSR) and can be used to shape a sound once a triggering event occurs. Attack determines whether the note will start abruptly or fade in Decay rate determines how the note fades to the sustain level Release determines how long it takes to fade to silence Oscillators repeatedly fluctuate (cycle) back and forth between positive and negative voltages (bipolar signal). The amplitude refers to the size of fluctuation, while frequency is the rate or speed of these cycles. Gives a synth its characteristic sound and timbre/tone. Controlled by volts per octave (V/oct) sent by CV informing the oscillator what frequency to oscillate at in order to produce a musical note. In most cases they are used to output sound, requiring an amplifier and envlope to control when notes turn on and off. Low Frequency Oscillators LFOs oscillate too slow to be perceived as pitch but useful for controlling parameters to rise and fall Musical Instrument Digital Interface (MIDI) is a polphonic digital control protocol. A MIDI signal is able to transmit information about when a key is pressed/released, processing like sustain and modulation, and continuous control (CC) messages. It can be used to control other instruments, through CV for example Timbre is the wave shape Slewing: smoothes out the signal by introducing a low pass filter. Attenuators (unipolar) or attenuverters (bipolar) serve to control the amount of signal sent to an input, allowing you to tame it into a more subtle range. They can control both the amount and polarity of incoming signal Filter (VCF): remove certrain frequencies in order to shape the sound resonance emphasizes the centre or cutoff frequency of the filter Envelope Generator (EG): controls the volume of the amplifier (usually via attack, delay, sustain and release). Each of these is a stage that determines how long it takes for the signal of the oscillator to reach its peak volume, secondary volume, and then drop to zero once the note is released. It also modulates the cutoff frequency of the filter. Amplifier (VCA): controls volume of the oscillator via volume knob and/or CV, and gates the oscillator/generator to turn the signal on/off. Sequencer: generates musical notes by providing pitch and gain signals that can be patched into oscillators, envelopes, etc. They play back a predetermined series of notes. Measured in steps, which correspond to a musical length of time (ex: sixteenth note) ",

        "title": "tools to make electronic music with",
        "tags": [],
        "content": "some gear I recommend looking into and considering:\nKorg Volca series: small compact boxes that cover many different approaches of creating sounds Are Korg Volcas Serious Instruments or Just Toys? Elektron Model:Cycles and Model:Samples: synth and sampler respectively Roland AIRA Compact series: similar to the Korg Volcas Novation Circuit Track: synths + drums Arturia DrumBrute Impact: analog drums Teenage Engineering PO-33 K.O! sampler Roland TR8: drums Roland TR8S: drums + sampler Arturia Microfreak any secondhand gear you find within budget that looks cool, after seeing what sort of sounds it can make I began looking at modular gear but opted for something less customisable and overwhelming. Gonna try explain different categories of gear to make music with.\nmodular Modular setups involve buying components individually and connecting (\u0026ldquo;patching\u0026rdquo;) them together. Whenever you see setups with many coloured cables all over the place they\u0026rsquo;re most likely modular or semi-modular. So instead of buying a box with everything in it, you buy separate components and connect them together. I decided to look at less customisable gear for multiple reasons:\nsince you\u0026rsquo;re buying components individually, it can be quite expensive to buy the essential modules to make sounds with (400+) many modules come as PCBs without housing, so you need to organise them onto \u0026ldquo;racks\u0026rdquo; since you\u0026rsquo;re buying individual components you kinda need to understand what the components do, and I feel like I had much more learning to do before knowing what the hell is a VCO, LFO, caring about different delay and reverb effect. you might wanna check out music synthesis glossary for more info about individual components and terms in the modular world.\nyour computer Software like garageband, ableton, logic (known as digital audio workstations or DAWs) are worth exploring and allow you to do more than you could buying gear, which is great but I\u0026rsquo;ve enjoyed exploring within the constraints of different gear I\u0026rsquo;ve used.\nnote: whenever I use the word \u0026lsquo;MIDI\u0026rsquo; I\u0026rsquo;m referring to the language devices use to communicate.\nThere\u0026rsquo;s a lot of fun software around for making different sounds too, like\nDigital versions of all the hardware exist too, and there are apps that let you build virtual modular racks (VCV Rack, miRack). I\u0026rsquo;ve spent some time with them but wanted the physical feel of knobs and buttons.\nNow that I have the physical gear I find myself spending more time with software for music too, tho I haven\u0026rsquo;t really used DAWs for anything more than recording and MIDI.\nanalog vs digital Analog synths generate sounds (continuous waveforms) through electrical circuits, while digital synths use computer algorithms running on electrical circuits. Modern digital gear sometimes include analog components, like analog filters.\nsamplers (sampled-based synths) Samplers are gear that can record sounds and play multiple of them back at the same time. A lot of samplers are actually sampler players and require you to transfer samples over from your computer/phone since they lack recording capabilities. You\u0026rsquo;ll have a bunch of tracks you can load sounds into, play with the start/end times of each sound and other ways to shape it, add fx.\nDAWs usually have sampling tools too, and ableton actually makes it really easy to work with and chop up samples.\nYou\u0026rsquo;ll find physical samplers with beatpads which allow you to control rows/columns of tracks which can help when playing live.\nthere\u0026rsquo;s a ton of fun sampler apps that let you record and mangle samples.\naphex twin created this to generate a sound from a bunch of other sounds https://gitlab.com/then-try-this/samplebrain koala sampler drambo flip sampler samplr gear I\u0026rsquo;ve used / recommendations\nalways look at secondhand gear tho cos you\u0026rsquo;ll be able to get higher budget gear and discover cool new gear that you\u0026rsquo;ve never seen before. Korg Volca Sample / Sample2 (~€150): my first sampler, really compact and does what you\u0026rsquo;d expect it to. memory\u0026rsquo;s kinda limited and you have 100-200 slots. I have the Sample2 which has more memory and sample slots, but there\u0026rsquo;s a custom [pajen firmware] for the original Sample that can actually make it a more worthwhile buy Elektron Model:Samples (~€300): got this one recently and it\u0026rsquo;s the Korg Volca Sampler\u0026rsquo;s big brother, with bigger pads and knobs, but less tracks (6 vs 10) but you can play multiple sounds on a track sooo Roland TR8S: the original TR8 has all the OG Roland drum samples but doesn\u0026rsquo;t let you transfer your own, hence the \u0026lsquo;S\u0026rsquo; for Sample Teenage Enginering pocket operators (~€80): Teenage Engineering Ep-133 K.O. II (~€300) subtractive synths an approach to synthesising sounds that involves \u0026ldquo;sculpting\u0026rdquo; rich complex sounds and \u0026ldquo;carving\u0026rdquo; away parts until you\u0026rsquo;re happy with the sound.\nin practice you take a harmonically rich waveform, like a square wave with multiple frequencies, and use filters to remove frequencies and shape how it changes over time. to use a guitar analogy, the string being plucked is a rich sound and the physical guitar filters the sound.\ngear I\u0026rsquo;ve used / recommendations\nKorg Monologue Behringer Model D frequency-modulation (FM) synths The beauty of FM is that it can create sounds that would be impossible with traditional instruments or basic waveforms.\nA different approach to synthesising sounds that involves shaping a sound and its personality/timbre by using waves to modulate other waves, creating new frequencies and changing the sound\u0026rsquo;s character. You\u0026rsquo;ll hear the words carrier (the sound you hear) and modulator (the sound used to shift the sound you\u0026rsquo;re hearing). Imagine pressing your finger on a guitar string and moving it up and down rapidly. The main string vibrating would be the carrier wave, and your finger movement would be the modulator, but with electronic waves instead of strings/vibration.\nYou start off with simple sine waves and build complex harmonics by modulating waveforms, or modulating other parameters that you can change, like the decay of a sound or filters.\ngear I\u0026rsquo;ve used / recommendations\nKorg Volca FM / FM2 Elektron Digitone / Digitone II (not only FM) / Digitone Keys (has a proper keyboard) Yamaha DX MIDI controllers essentially remote controls for DAWs and software that don\u0026rsquo;t make any sound themselves but let you map software buttons to physical buttons, knobs, pads, wheels and sliders using MIDI.\nCan use these to control software for visuals too, and a whole bunch of other stuff really.\n",
